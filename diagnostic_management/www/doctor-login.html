{# /doctor-login — Doctor Sign-In page. Same SPA shell. #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azzir ADMS — Doctor Sign In</title>
    {% if stylesheet %}<link rel="stylesheet" href="{{ stylesheet }}" />{% endif %}
    <script>
      window.csrf_token = "{{ csrf_token }}";
      window.frappe = { csrf_token: "{{ csrf_token }}" };
      window.__ADMS_BASE__ = "/doctor-login";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="{{ entry }}"></script>
  </body>
</html>
